<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161C">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Parrlo Translate · гостевая страница по QR (макет)</title>
<link rel="icon" href="mark.svg" type="image/svg+xml">
<style>
@font-face{font-family:Nunito;font-weight:200 1000;src:url(fonts/Nunito-sub.woff2) format("woff2");font-display:swap}
@font-face{font-family:Inter;font-weight:100 900;src:url(fonts/Inter-sub.woff2) format("woff2");font-display:swap}
:root{--bg:#12161C;--surface:#1C2026;--raised:#242B34;--text:#E8ECF1;--sec:#9AA4B2;--sec2:#B4BDC9;--line:#2F3742;
 --mint:#2BC48A;--mintDeep:#00875C;--green:#00A86B;--partner:#BFF2DC;--onBtn:#0E1116;--beak:#FFC247;--err:#FF6B5E;
 --bubMe:rgba(0,168,107,.16);--fill:rgba(255,255,255,.10);--glassTint:rgba(232,236,241,.075);--glassEdge:rgba(47,55,66,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:400 17px/1.34 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;overflow:hidden;color-scheme:dark}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--partner);outline-offset:2px}
a{color:inherit;text-decoration:none}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- каркас: колонка / телефонная рамка ---------- */
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch;position:relative}
.guest{position:relative;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--bg);isolation:isolate}
.stage[data-frame]{align-items:center;padding:12px}
.stage[data-frame] .guest{width:var(--fw);height:min(var(--fh,844px),100%);border-radius:44px;overflow:hidden;box-shadow:0 0 0 1px #2a2f36,0 24px 60px rgba(0,0,0,.5)}
.png-mode .stage[data-frame]{padding:0}

/* ---------- фон «Волна и искры»: 3 небольших переливающихся пятна ---------- */
.fx{position:absolute;inset:0;pointer-events:none;z-index:-1}
.blob{position:absolute;width:140px;height:140px;border-radius:50%;filter:blur(30px);opacity:.55;
 background:conic-gradient(from 30deg,#00A86B,#7FD9B4,#2BC48A,#0B8F5E,#BFF2DC,#00A86B);animation:spin 26s linear infinite,drift1 19s ease-in-out infinite alternate}
.blob.b1{left:-80px;top:30%}
.blob.b2{width:116px;height:116px;right:-50px;top:3%;opacity:.42;background:conic-gradient(from 200deg,#2BC48A,#00A86B,#FFC247 18%,#2BC48A 30%,#7FD9B4,#2BC48A);animation-duration:34s,23s}
.blob.b3{width:100px;height:100px;right:-40px;top:70%;opacity:.40;background:conic-gradient(from 90deg,#00A86B,#BFF2DC,#6AA6F5 20%,#00A86B 38%,#2BC48A,#00A86B);animation-duration:30s,27s}
@keyframes spin{to{rotate:360deg}}
@keyframes drift1{from{translate:0 0}to{translate:26px -22px}}
.png-mode .blob{animation:none}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}

/* ---------- шапка ---------- */
.top{display:flex;align-items:center;gap:8px;padding:12px 16px 0;min-height:60px;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand img{height:32px;width:auto;aspect-ratio:735/840;display:block}
.wt{font:900 22px/1 Nunito,sans-serif;letter-spacing:-.01em}.wt i{font-style:normal;color:var(--green)}
.glass{background:var(--glassTint);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px var(--glassEdge)}
.pair{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:999px;font:800 16px/1 Nunito,sans-serif;color:var(--text)}
.pair b{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.pair svg{width:14px;height:14px;stroke:var(--sec);stroke-width:2.4}
.pair.warn b:first-child{background:var(--beak)}
.kbd{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.kbd svg{width:24px;height:24px}
.kbd[aria-disabled=true]{opacity:.35;pointer-events:none}

/* ---------- лента ---------- */
.feed{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 16px 22px;display:flex;flex-direction:column;position:relative;z-index:1;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.feed{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12px,#000 calc(100% - 20px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 12px,#000 calc(100% - 20px),transparent 100%)}
.feed.conv>:first-child{margin-top:auto}
.idle{margin:auto;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:8px 8px 18px}
.idle .mk{width:92px;height:auto;aspect-ratio:735/840}
.idle h1{font:800 28px/1.12 Inter,sans-serif;letter-spacing:-.015em;text-wrap:balance}
.idle p{font:400 15px/1.45 Inter,sans-serif;color:var(--sec2);max-width:30ch;text-wrap:balance}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--fill);font:700 12px/1.34 Inter,sans-serif;color:var(--sec2);white-space:nowrap}.chip i{width:9px;height:9px;border-radius:50%}

/* ---------- облачка: радиус 18, хвост 6 ---------- */
.turn{display:flex;flex-direction:column;gap:5px;margin-top:18px;align-items:flex-end}
.turn:first-child{margin-top:0}
.src{padding:10px 15px 11px;border-radius:18px;border-bottom-right-radius:6px;background:var(--bubMe);font:500 17px/1.34 Inter,sans-serif;max-width:100%}
.tr{display:flex;align-items:flex-end;gap:6px;padding:13px 18px 14px;border-radius:18px;border-top-right-radius:6px;background:var(--mintDeep);color:#fff;font:700 22px/29px Nunito,sans-serif;letter-spacing:-.005em;width:100%}
.tr.cyr{font-family:Inter,sans-serif;font-weight:700;letter-spacing:-.01em}
.tr .t{flex:1;min-width:0}
.sp{margin:-8px -10px -9px auto;flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.sp span{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.sp svg{width:17px;height:17px;fill:currentColor}
.meta{display:flex;align-items:center;gap:6px;padding:0 6px;font:400 12px/1.34 Inter,sans-serif;color:var(--sec2)}.meta i{width:7px;height:7px;border-radius:50%;background:var(--mint)}
.live .src{color:#B4BDC9}
.d{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--mint);margin-left:3px;vertical-align:2px;animation:dot .9s ease-in-out infinite}
.d:nth-child(2){animation-delay:.15s}.d:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.35;transform:none}50%{opacity:1;transform:translateY(-2px)}}
.png-mode .d,.png-mode .mic.rec{animation:none}
@media (prefers-reduced-motion:reduce){.d{animation:none}.mic.rec{animation:none!important}}
.pop{animation:pop .38s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:fade .2s both}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* окно фразы (обработка) */
.win{border-radius:28px;background:rgba(28,32,38,.78);padding:14px 16px 14px;box-shadow:inset 0 0 0 1px var(--glassEdge),0 14px 20px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px;margin-top:auto}
.win .l{display:flex;align-items:center;gap:7px;font:700 13px/1.2 Inter,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--sec2)}.win .l i{width:9px;height:9px;border-radius:50%;background:var(--mint)}
.win .raw{font:400 15px/1.4 Inter,sans-serif;color:#B4BDC9}
.win .clean{font:800 20px/1.25 Inter,sans-serif;letter-spacing:-.005em}
.win .f{font:400 12px/1.34 Inter,sans-serif;color:var(--sec2)}

/* «Волна и искры» */
.mo{position:relative;padding:10px 15px 11px;border-radius:18px;border-bottom-right-radius:6px;background:var(--bubMe);font:500 17px/1.34 Inter,sans-serif;max-width:100%;transform-origin:100% 100%}
.mo .box{display:grid;overflow:hidden}.mo .box>div{grid-area:1/1}
.mo canvas{position:absolute;left:-20px;top:-20px;pointer-events:none}
.mo .sheen{position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:screen;opacity:0}

/* ---------- кнопка микрофона ---------- */
.dock{padding:10px 16px max(14px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;position:relative;z-index:2}
.mic{width:100%;height:62px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 14px;position:relative;font:700 20px/1 Inter,sans-serif;color:var(--onBtn);background:var(--mint);box-shadow:0 12px 26px rgba(43,196,138,.26);white-space:nowrap}
.mic svg{width:24px;height:24px}
.mic::after{content:"";position:absolute;inset:0;border-radius:999px;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 48%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.mic .sq{width:12px;height:12px;border-radius:3px;background:currentColor;margin:0 6px}
.mic.busy{opacity:.5;pointer-events:none}.mic.off{opacity:.3;pointer-events:none}
.mic.rec{box-shadow:0 0 0 6px rgba(43,196,138,.38);animation:halo 1.2s ease-out infinite}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(43,196,138,.55)}100%{box-shadow:0 0 0 14px rgba(43,196,138,0)}}
.png-mode .mic.rec{box-shadow:0 0 0 6px rgba(43,196,138,.38)}
.mic:active{transform:scale(.98)}

/* ---------- карточки, плашки, кнопки ---------- */
.card{border-radius:22px;padding:14px 16px;background:var(--glassTint);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px var(--glassEdge)}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ic svg{width:22px;height:22px}
.ic.warn{background:rgba(255,194,71,.16);color:var(--beak)}
.ic.err{background:rgba(255,107,94,.16);color:var(--err)}
.ic.neutral{background:var(--fill);color:var(--sec2)}
.ic.big{width:104px;height:104px}.ic.big svg{width:46px;height:46px}
.permcard{display:flex;flex-direction:column;gap:6px;margin:0}
.permcard .r{display:flex;gap:12px;align-items:flex-start}
.permcard h2,.banner h2{font:700 16px/1.25 Inter,sans-serif}
.permcard p,.banner p{font:400 14px/1.4 Inter,sans-serif;color:var(--sec2);margin-top:2px}
.link{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;font:700 16px/1.2 Inter,sans-serif;color:var(--mint)}
.permcard .link{align-self:flex-start;margin-left:-14px}
.btn{min-height:52px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 24px;font:700 17px/1.2 Inter,sans-serif;width:100%}
.btn.mint{background:var(--mint);color:var(--onBtn);min-height:56px}
.btn.ghost{background:var(--fill);color:var(--text)}
.btn.sm{min-height:44px;width:auto;padding:0 18px;font-size:15px}
.errmid{margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:8px 8px 24px}
.errmid h1{font:800 26px/1.15 Inter,sans-serif;letter-spacing:-.015em;text-wrap:balance}
.errmid p{font:400 15px/1.45 Inter,sans-serif;color:var(--sec2);max-width:30ch;text-wrap:balance}
.errmid .btn{max-width:300px}
.how{width:100%;max-width:320px;text-align:left;display:flex;flex-direction:column;align-items:center}
.how summary{list-style:none;cursor:pointer;margin-top:2px}
.how summary::-webkit-details-marker{display:none}
.how>div{margin-top:8px;padding:12px 14px;border-radius:16px;background:var(--fill);font:400 14px/1.45 Inter,sans-serif;color:var(--sec2)}
.how>div p+p{margin-top:8px}.how .lead{color:var(--text);font-weight:600}
.how b{color:var(--text);font-weight:600}
.banner{display:flex;gap:12px;align-items:center;margin:8px 16px 0;position:relative;z-index:3}
.banner .x{flex:1;min-width:0}
.endrow{display:flex;justify-content:center;margin-top:10px}
.sheet{margin:0 12px;border-radius:28px;padding:18px 16px 8px;background:rgba(28,32,38,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:inset 0 0 0 1px var(--glassEdge),0 -10px 40px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center}
.sheet h2{font:800 22px/1.2 Inter,sans-serif;letter-spacing:-.01em}
.sheet p{font:400 15px/1.45 Inter,sans-serif;color:var(--sec2);margin-top:-4px;margin-bottom:4px}
/* МАКЕТНЫЕ бейджи: в релизе заменить официальными ассетами Apple / Google (пропорции 3:1 и ≈3,4:1, высота 56, отступ логотипа 1/4 высоты) */
.badges{display:flex;flex-direction:column;align-items:center;gap:12px;margin:2px 0 4px}
.badge{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 14px;border-radius:10px;background:#000;color:#fff;box-shadow:inset 0 0 0 1px #A6A6A6;text-align:left;white-space:nowrap}
.badge.apple{min-width:168px}.badge.play{min-width:189px}
.badge svg{width:28px;height:28px;flex:none}
.badge .bt{display:flex;flex-direction:column;gap:1px}
.badge small{font:500 11px/1.1 Inter,sans-serif;letter-spacing:.01em}
.badge b{font:600 22px/1.05 Inter,sans-serif;letter-spacing:-.01em}
.badge:disabled{background:#242B34;color:#9AA4B2;box-shadow:inset 0 0 0 1px #3A4452;cursor:not-allowed}
.badge:disabled svg{filter:grayscale(1);opacity:.5}
.badge:disabled small{color:#C2CAD5;font-weight:700}
.dim .feed{opacity:.35}
/* текстовый ввод */
.comp{display:flex;flex-direction:column;gap:8px}
.comp .dir{align-self:flex-start;margin-left:56px;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font:700 13px/1.2 Inter,sans-serif;color:var(--text);background:var(--fill)}
.comp .dir b{width:8px;height:8px;border-radius:50%;background:#fff}.comp .dir b.g{background:var(--mint)}
.comp .dir svg{width:12px;height:12px;stroke:var(--sec);stroke-width:2.6}
.comp .row{display:flex;align-items:flex-end;gap:10px}
.rbtn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none}
.rbtn.x{background:rgba(28,32,38,.9);box-shadow:inset 0 0 0 1px var(--line)}
.rbtn.go{background:var(--mint);color:var(--onBtn)}
.rbtn svg{width:24px;height:24px;stroke-width:2.4}
.field{flex:1;min-width:0;border-radius:26px;background:rgba(28,32,38,.86);box-shadow:inset 0 0 0 1px var(--glassEdge);padding:13px 16px}
.field textarea{display:block;width:100%;height:96px;resize:none;background:none;border:0;color:var(--text);font:400 17px/1.34 Inter,sans-serif;caret-color:var(--mint)}
.field textarea::placeholder{color:#8993A1}
textarea{outline:0}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--mint)}
.field textarea:focus-visible{outline:0}
.png-mode .stage[data-frame] .guest{border-radius:0;box-shadow:none}
.turn .meta{align-self:flex-end}
.stage{overflow:hidden}

.src.host{background:var(--raised);border-bottom-left-radius:6px;border-bottom-right-radius:18px;align-self:flex-start;max-width:84%}
.tr.host{background:var(--raised);color:var(--text);border-top-left-radius:6px;border-top-right-radius:18px;width:auto;align-self:flex-start;max-width:90%}
.turn.them .meta{align-self:flex-start}
/* ---------- панель макета (не часть страницы; скрыта при ?clean=1 / ?png=1) ---------- */
.mockpanel{position:relative;z-index:50;flex:none;font:500 13px/1.35 Inter,sans-serif;color:#C7CED8}
.mockpanel .pt{display:flex;width:100%;min-height:44px;background:#0B0E12;border-bottom:1px solid #2A2F36;color:#C7CED8;font:600 13px Inter,sans-serif;padding:0 14px;align-items:center;justify-content:space-between}
.mockpanel .pb{display:none;position:absolute;top:44px;left:0;right:0;background:#0B0E12;padding:12px 14px 16px;max-height:calc(100dvh - 44px);overflow:auto;border-bottom:1px solid #2A2F36}
.mockpanel.open .pb{display:block}
.mockpanel h2{font:800 15px/1.2 Inter,sans-serif;color:#fff;margin-bottom:4px}
.mockpanel h3{font:700 11px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#8E99A8;margin:14px 0 6px}
.mockpanel .pg{display:flex;flex-wrap:wrap;gap:6px}
.mockpanel .pg button{min-height:44px;padding:0 12px;border-radius:10px;background:#171C23;color:#D5DBE3;font:600 13px Inter,sans-serif;box-shadow:inset 0 0 0 1px #2A2F36;text-align:left}
.mockpanel .pg button.on{background:#12382B;color:#fff;box-shadow:inset 0 0 0 1.5px var(--mint)}
.mockpanel .pn{margin-top:12px;color:#8E99A8;font-size:12px}
.mockpanel .pn b{color:#C7CED8}
@media (min-width:1000px){
  body{flex-direction:row}
  .mockpanel{width:300px;height:100%;border-right:1px solid #2A2F36;background:#0B0E12;overflow:auto}
  .mockpanel .pt{display:none}
  .mockpanel .pb{display:block;position:static;max-height:none;border:0;padding:18px 16px}
}
.clean .mockpanel{display:none}

</style>
</head>
<body>
<aside class="mockpanel" id="panel"></aside>
<div class="stage" id="stage"><div class="guest" id="g" data-s="">
  <div class="fx" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
  
  <header class="top" id="top"></header>
  <div id="bn"></div>
  <main class="feed" id="feed" aria-live="polite"></main>
  <div id="over"></div>
  <footer class="dock" id="dock"></footer>
</div></div>
<script>
const MODE="web", ROOT="", HOME="welcome", DEFAULT_FRAME="auto", PANEL_TITLE="Parrlo Translate";
const STATES=[["welcome", "1 · Приветствие и микрофон"], ["rec", "2 · Идёт запись"], ["proc", "3 · Обработка"], ["morph", "4 · Фраза → перевод (искры)"], ["done", "5 · Перевод готов"], ["reply", "6 · Ответ хозяина"], ["text", "7 · Текстовый ввод"], ["err-mic", "8 · Нет микрофона"], ["err-mic-help", "9 · …«Открыть настройки»"], ["offline", "10 · Нет сети"], ["limit", "11 · Лимит исчерпан"], ["download", "12 · Скачать Parrlo"]];

   <div class="pair glass${warn ? ' warn' : ''}" role="img" aria-label="${c0} → ${c1}"><b></b>${c0}${IC.arr}${c1}<b style="background:var(--mint)"></b></div>
   <button class="kbd glass" data-act="text" aria-label="${t.kbd}" ${dis ? 'aria-disabled="true"' : ''}>${IC.kbd}</button>`;
  const bn = $('bn'), feed = $('feed'), dock = $('dock'), over = $('over');
  bn.innerHTML = ''; over.innerHTML = ''; feed.className = 'feed';
  let dockHTML = micBtn(t), clipBanner = MODE === 'clip' && !ctx.bnHidden;
  switch (S) {
    case 'card': over.innerHTML = cardScene(t); clipBanner = false; break;
    case 'welcome':
      feed.innerHTML = idleHTML(t);
      dockHTML = `<div class="card permcard"><div class="r"><div class="ic neutral">${IC.mic}</div><div><h2>${t.permTitle}</h2><p>${t.permText}</p></div></div><button class="link" data-act="text">${t.permLink}</button></div>` + micBtn(t); break;
    case 'idle': feed.innerHTML = idleHTML(t); break;
    case 'perm': feed.innerHTML = idleHTML(t); clipBanner = false;
      over.innerHTML = `<div class="scrim"><div class="alert" role="alertdialog" aria-label="${t.alT}"><div class="ab"><b>${t.alT}</b><p>${t.alP}</p></div><div class="ar"><button data-act="pdeny">${t.alNo}</button><button class="pri" data-act="pallow">${t.alOk}</button></div></div></div>`; break;
    case 'rec': {
      feed.className = 'feed conv';
      const words = d.raw.split(' ');
      feed.innerHTML = `<div class="turn live"><div class="src"><span id="lw">${opts.anim ? '' : d.raw}</span> <span class="d"></span><span class="d"></span><span class="d"></span></div><div class="meta"><i></i>${t.listening}</div></div>`;
      if (opts.anim) { let n = 0; const tick = () => { n++; $('lw').textContent = words.slice(0, n).join(' '); if (n < words.length) later(tick, 260); }; later(tick, 300); }
      dockHTML = micBtn(t, 'rec'); clipBanner = false; break; }
    case 'proc':
      feed.className = 'feed conv';
      if (ctx.text) { feed.innerHTML = `<div class="turn live"><div class="src">${d.typed}</div><div class="meta"><i></i>${t.preparing}</div></div>`; dockHTML = micBtn(t, 'busy'); clipBanner = false; break; }
      feed.innerHTML = `<div class="win"><div class="l"><i></i>${t.lit}</div><div class="raw">${t.heard} ${d.heard}</div><div class="clean">${d.clean}</div><div class="f">${t.preparing}</div></div>`;
      dockHTML = micBtn(t, 'busy'); clipBanner = false;
      if (opts.flow) later(() => go('morph', { flow: true }), 1500); break;
    case 'morph': {
      feed.className = 'feed conv'; feed.innerHTML = '<div class="turn" id="mt"></div>';
      dockHTML = micBtn(t, 'busy'); clipBanner = false;
      const run = () => morph($('mt'), d.raw.replace(/^./, c => c), d.clean, opts.flow ? null : .7).then(() => {
        if (!opts.flow || tok !== gen) return;
        feed.firstChild.insertAdjacentHTML('beforeend', srcMeta(t));
        feed.insertAdjacentHTML('beforeend', `<div class="turn pop" style="margin-top:5px;align-items:stretch">${trHTML(d.tr)}</div>`);
        later(() => { S = 'done'; g.dataset.s = 'done'; ctxDone(); }, 450);
      });
      (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(run)); break; }
    case 'done': case 'reply': case 'download': {
      feed.className = 'feed conv'; feed.innerHTML = doneFeed(t, d, ctx.text) + (S === 'reply' ? hostTurn(t, d) : '');
      if (MODE === 'web' && (S === 'done' || S === 'reply')) feed.insertAdjacentHTML('beforeend', `<div class="endrow"><button class="link" data-act="dl">${IC.dl}${t.dlLink}</button></div>`);
      if (S === 'download') { g.classList.add('dim'); dockHTML = sheetHTML(t); clipBanner = false; }
      if (opts.flow && S === 'done') {} break; }
    case 'text':
      feed.innerHTML = idleHTML(t, false); dockHTML = composer(t); clipBanner = false; break;
    case 'err-mic': case 'err-mic-help': {
      const clip = MODE === 'clip', open = S === 'err-mic-help';
      const tIc = IC.kbd.replace('class="i"', 'class="i" style="width:22px;height:22px"');
      feed.innerHTML = `<div class="errmid"><div class="ic err big">${IC.micoff}</div><h1>${t.noMicT}</h1><p>${clip ? t.noMicClipP : t.noMicP}</p>` +
        (clip ? `<button class="btn mint" data-act="noop">${t.openSet}</button><button class="link" data-act="text">${t.typeLink}</button>`
              : `<button class="btn mint" data-act="text">${tIc}${t.noMicBtn}</button><details class="how" ${open ? 'open' : ''}><summary class="btn ghost sm">${t.how}</summary><div><p class="lead">${t.howLead}</p><p>${t.howIos}</p><p>${t.howAnd}</p></div></details>`) + '</div>';
      dockHTML = micBtn(t, 'offmute'); break; }
    case 'offline':
      bn.innerHTML = `<div class="card banner" role="alert"><div class="ic warn">${IC.wifioff}</div><div class="x"><h2>${t.offT}</h2><p>${t.offP}</p></div><button class="btn ghost sm" data-act="retry">${t.retry}</button></div>`;
      feed.className = 'feed conv';
      feed.innerHTML = `<div class="turn"><div class="src">${ctx.text ? d.typed : d.clean}</div><div class="meta"><i style="background:var(--beak)"></i>${t.unsent}</div></div>`;
      dockHTML = micBtn(t, 'off'); break;
    case 'limit':
      feed.innerHTML = `<div class="errmid"><div class="ic neutral big">${IC.cloudoff}</div><h1>${t.limT}</h1><p>${t.limP}</p><button class="btn ghost" data-act="retry">${t.limBtn}</button></div>`;
      dockHTML = micBtn(t, 'off'); clipBanner = false; break;
  }
  dock.innerHTML = dockHTML + (clipBanner ? bannerClip(t) : '');
  dock.style.display = S === 'card' ? 'none' : '';
  if (typeof syncPanel === 'function') syncPanel();
  if (!PNG && !opts.noUrl) { const u = new URL(location.href); u.searchParams.set('s', S); u.searchParams.set('from', lang); u.searchParams.set('to', to); u.searchParams.delete('lang'); history.replaceState(null, '', u); }
}
function ctxDone() { const t = T[lang]; const feed = $('feed'); const k = document.querySelector('.kbd'); if (k) k.removeAttribute('aria-disabled'); if (MODE === 'web') feed.insertAdjacentHTML('beforeend', `<div class="endrow pop"><button class="link" data-act="dl">${IC.dl}${t.dlLink}</button></div>`); $('dock').innerHTML = micBtn(t) + (MODE === 'clip' && !ctx.bnHidden ? bannerClip(t) : ''); if (typeof syncPanel === 'function') syncPanel(); }
function go(s, o) { S = s; render(o); }

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'noop') { e.preventDefault(); return; }
  if (b.getAttribute('aria-disabled') === 'true') return;
  if (a === 'mic') { if (MODE === 'clip' && !ctx.permAsked && S === 'idle') { ctx.permAsked = true; go('perm'); } else { ctx.text = false; go('rec', { anim: true }); } }
  else if (a === 'pallow') go('rec', { anim: true });
  else if (a === 'pdeny') go('err-mic');
  else if (a === 'stop') { ctx.text = false; go('proc', { flow: true }); }
  else if (a === 'text') go('text');
  else if (a === 'tclose') go(HOME);
  else if (a === 'send') { ctx.text = true; go('proc'); later(() => go('done'), 1100); }
  else if (a === 'retry') go(HOME);
  else if (a === 'dl') go('download');
  else if (a === 'dlclose') go('done');
  else if (a === 'bnclose') { ctx.bnHidden = true; render({ noUrl: true }); }
  else if (a === 'speak') { b.firstChild.style.transform = 'scale(1.15)'; setTimeout(() => b.firstChild.style.transform = '', 300); }
  if (a !== 'speak') e.preventDefault();
});

/* ---------- панель макета ---------- */
function buildPanel() {
  const P = $('panel'); if (!P) return;
  P.innerHTML = `<button class="pt" id="pt"><span>Макет · <b id="pcur"></b></span><span>▾</span></button><div class="pb">
   <h2>${PANEL_TITLE}</h2><div style="color:#8E99A8">Состояния и языки — только для просмотра макета.</div>
   <h3>Состояние</h3><div class="pg" id="pst"></div>
   <h3>Гость говорит (from)</h3><div class="pg" id="pln"></div>
   <h3>Хозяин говорит (to)</h3><div class="pg" id="pto"></div>
   <h3>Рамка</h3><div class="pg" id="pfr"></div><div class="pn" id="pnote"></div></div>`;
  $('pst').innerHTML = STATES.map(([id, n]) => `<button data-p="s:${id}">${n}</button>`).join('');
  $('pln').innerHTML = ['ru', 'es', 'en'].map(l => `<button data-p="l:${l}">${l.toUpperCase()}</button>`).join('');
  $('pto').innerHTML = ['ru', 'es', 'en'].map(l => `<button data-p="t:${l}">${l.toUpperCase()}</button>`).join('');
  $('pfr').innerHTML = [['auto', 'По окну'], ['360', '360'], ['390', '390'], ['430', '430']].map(([w, n]) => `<button data-p="w:${w}">${n}</button>`).join('');
  $('pt').onclick = () => P.classList.toggle('open');
  P.onclick = (e) => { const b = e.target.closest('[data-p]'); if (!b) return; const [k, v] = b.dataset.p.split(':');
    if (k === 's') { ctx.text = false; go(v); P.classList.remove('open'); } else if (k === 'l') { lang = v; if (to === lang) to = DEFTO[lang]; render(); } else if (k === 't') { if (v !== lang) { to = v; render(); } } else if (k === 'w') { setFrame(v); render({ noUrl: false }); } };
}
function syncPanel() {
  const P = $('panel'); if (!P) return;
  P.querySelectorAll('[data-p]').forEach(b => { const [k, v] = b.dataset.p.split(':'); b.classList.toggle('on', (k === 's' && v === S) || (k === 'l' && v === lang) || (k === 't' && v === to) || (k === 'w' && v === frame)); });
  $('pcur').textContent = (STATES.find(s => s[0] === S) || [])[1] + ' · ' + lang.toUpperCase() + '→' + to.toUpperCase();
  $('pnote').innerHTML = typeof panelNote === 'function' ? panelNote() : '';
}

buildPanel(); setFrame(frame); render({noUrl:true});
</script>
</body>
</html>
