<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Макет · Parrlo Translate Web · бренд v2</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="theme-color" content="#0E1116"><meta name="color-scheme" content="dark">
<style>
:root{--bg:#0E1116;--s:#1A1F27;--s2:#242B35;--t:#F2F5F8;--m:#9AA5B1;--a:#2BC48A;--ink:#0E1116}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:rgba(14,17,22,.94);backdrop-filter:blur(8px);border-bottom:1px solid #ffffff14;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;min-width:0}
.brand img{width:30px;height:30px;flex:none}
.badge{background:#FFC247;color:#0E1116;font-weight:800;font-size:12px;letter-spacing:.04em;padding:3px 9px;border-radius:99px;text-transform:uppercase;white-space:nowrap}
.sp{flex:1 1 0}
.seg{display:inline-flex;background:var(--s);border-radius:12px;padding:3px;gap:2px}
.seg button{background:none;border:0;padding:7px 12px;border-radius:9px;color:var(--m);font-weight:600;min-height:36px}
.seg button[aria-pressed=true]{background:var(--a);color:var(--ink)}
.seg button:focus-visible,.nav button:focus-visible,#list button:focus-visible,#stage:focus-visible{outline:2px solid var(--a);outline-offset:2px}
main{display:grid;grid-template-columns:240px 1fr;gap:0;min-height:calc(100vh - 60px)}
aside{border-right:1px solid #ffffff10;padding:12px 10px;overflow:auto;max-height:calc(100vh - 60px);position:sticky;top:60px;align-self:start}
aside h3{margin:12px 6px 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--m)}
#list button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:10px;color:var(--t)}
#list button[aria-current=true]{background:var(--s2);color:var(--a);font-weight:700}
#list button:hover{background:var(--s)}
section.v{padding:14px;min-width:0}
.info{max-width:760px;margin:0 auto 12px;background:var(--s);border-radius:14px;padding:11px 14px}
.info b{display:block;font-size:16px}.info span{color:var(--m)}
.nav{display:flex;gap:8px;justify-content:center;align-items:center;margin:0 auto 12px;flex-wrap:wrap}
.nav button{background:var(--s2);border:0;border-radius:12px;padding:8px 14px;min-height:40px}
.nav .cnt{color:var(--m);min-width:64px;text-align:center}
#stage{display:flex;gap:18px;justify-content:center;align-items:flex-start;flex-wrap:wrap;outline:none}
figure{margin:0;min-width:0;max-width:100%}
figure:has(>.ph){flex:0 1 402px;width:402px}
figure:has(>.dk.two){flex:0 1 640px;width:640px}
figcaption{text-align:center;font-weight:800;margin-bottom:6px;font-size:13px;letter-spacing:.05em}
figure.b figcaption{color:var(--m)}figure.a figcaption{color:var(--a)}
.ph{border-radius:34px;padding:8px;background:#000;border:1px solid #ffffff22;width:min(100%,402px)}
.ph img{display:block;width:100%;height:auto;border-radius:26px;cursor:pointer}
.dk{width:min(100%,1180px);border-radius:12px;overflow:hidden;border:1px solid #ffffff22}
.dk.two{width:min(100%,640px)}
.dk img{display:block;width:100%;height:auto;cursor:pointer}
.dk .bar{height:22px;background:#242B35;display:flex;gap:6px;align-items:center;padding:0 10px}.dk .bar i{width:9px;height:9px;border-radius:50%;background:#ffffff40}
.note{max-width:760px;margin:12px auto 0;color:var(--m);font-size:13px;text-align:center}
.assets{max-width:1000px;margin:0 auto}
.assets h2{font-size:18px;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--s);border-radius:14px;padding:12px;text-align:center;min-width:0}
.card img{max-width:100%;height:auto;display:block;margin:0 auto 8px;background:#fff1;border-radius:8px}
.card small{color:var(--m);display:block;word-break:break-all}
.og{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.og img{width:100%;height:auto;border-radius:10px;display:block}
@media(max-width:820px){main{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid #ffffff10;display:none}aside.open{display:block}#menu{display:inline-block}}
@media(min-width:821px){#menu{display:none}}
</style></head><body>
<header>
 <div class="brand"><img src="mark.svg" alt=""><span>Parrlo Translate · веб</span><span class="badge">Макет</span></div>

</header>
<main>
<aside id="aside"><div id="list"></div></aside>
<section class="v">

</section>
</main>

 if(S.tab==="cmp"){const sv=S.dev;S.dev="mobile";st.innerHTML=fig("app","ПРИЛОЖЕНИЕ (RU)","mobile")+fig("after","ВЕБ · "+S.lang.toUpperCase(),"mobile");S.dev=sv;
